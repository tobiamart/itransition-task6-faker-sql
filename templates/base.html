<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Faker SQL{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23336791'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M7 26c1.5-5 5-7 9-7s7.5 2 9 7' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <style>
    :root { --brand: #336791; }
    body { background: #f5f6f8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .navbar { background: #fff; border-bottom: 1px solid rgba(0,0,0,.08); }
    .brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--brand); color: #fff;
                  display: inline-grid; place-items: center; font-weight: 700; }
    .panel { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 10px; padding: 18px 20px; }
    .btn-brand { --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand); --bs-btn-color: #fff;
                 --bs-btn-hover-bg: #2a5578; --bs-btn-hover-border-color: #2a5578; --bs-btn-hover-color: #fff; }
    .nav-link.active { color: var(--brand) !important; font-weight: 600; }
    code.sql { background: #f1f3f5; color: #1d3a55; padding: 2px 6px; border-radius: 4px; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="/"><span class="brand-mark">F</span>Faker SQL</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Generator</a>
        <a class="nav-link {% if request.path == '/benchmark' %}active{% endif %}" href="/benchmark">Benchmark</a>
        <a class="nav-link {% if request.path == '/docs' %}active{% endif %}" href="/docs">Documentation</a>
      </div>
    </div>
  </nav>
  <main class="container-xl py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
